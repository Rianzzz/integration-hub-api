name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: integration_hub
          POSTGRES_PASSWORD: integration_hub
          POSTGRES_DB: integration_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://integration_hub:integration_hub@localhost:5432/integration_hub
      JWT_SECRET_KEY: chave-de-teste-do-ci-com-32-bytes-no-minimo
      API_USERNAME: admin
      API_PASSWORD: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências
        run: poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Aplicar migrations
        run: poetry run alembic upgrade head

      - name: Rodar testes
        run: poetry run pytest
